[package]
name = "compass"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"
chrono = "0.4"
dirs = "5.0"
inquire = "0.7"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# cosmic-config usa RON, no JSON: los ficheros de config de cada app de COSMIC
# (favorites, tab, context_actions…) están en RON.
ron = "0.8"
